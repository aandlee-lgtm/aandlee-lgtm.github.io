name: Daily fare scan
# Every morning (about 6:17 am Sydney summer time, 5:17 am in winter): scan, rebuild index.html, publish.
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .
      - name: Scan and build the page
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 -m farewatch --out index.html
      - name: Publish
        run: |
          git config user.name "fare-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily fare scan $(TZ=Australia/Sydney date +%Y-%m-%d)"
          git push
