# Sydney Fare Watch — the owner's watchlist (edit freely).
# Each entry is one city. "airports" are the IATA codes searched; "under_aud" is the target
# return fare in Australian dollars for 1 adult, economy. A fare at or below it is "compelling".

origin = "SYD"

[settings]
min_nights = 7               # 1 week
max_nights = 42              # 6 weeks
months_ahead = 12            # this month plus the next 12
max_age_days = 3             # a fare must have been found by a real search within this many days
# Countries a trip may not connect through (ISO codes). Since 13 Nov 2026 the Middle East (e.g. Dubai,
# Abu Dhabi, Doha) is allowed; Türkiye stays excluded. Add e.g. "AE", "QA" to exclude them again.
excluded_transit_countries = ["TR"]

[[city]]
name = "Paris"
airports = ["PAR"]          # Charles de Gaulle and Orly
under_aud = 1300

[[city]]
name = "London"
airports = ["LON"]          # Heathrow, Gatwick and the other London airports
under_aud = 1300

# More European cities (owner's request, 13 Nov 2026): Paris has few fares in the free data, so a
# good fare into Europe is still caught; Paris is a short train or flight from each.
[[city]]
name = "Rome"
airports = ["ROM"]          # Fiumicino and Ciampino
under_aud = 1300

[[city]]
name = "Amsterdam"
airports = ["AMS"]
under_aud = 1300

[[city]]
name = "Frankfurt"
airports = ["FRA"]
under_aud = 1300

[[city]]
name = "Milan"
airports = ["MIL"]          # Malpensa, Linate and Bergamo
under_aud = 1300

[[city]]
name = "Barcelona"
airports = ["BCN"]
under_aud = 1300

[[city]]
name = "Tokyo"
airports = ["TYO"]          # Haneda and Narita
under_aud = 1000

[[city]]
name = "Osaka / Kyoto"
airports = ["OSA"]          # Kansai (KIX) and Itami; Kyoto has no airport, Kansai is the usual gateway
under_aud = 1000

[[city]]
name = "Shanghai"
airports = ["SHA"]          # Pudong and Hongqiao
under_aud = 1000

[[city]]
name = "Guangzhou"
airports = ["CAN"]
under_aud = 1000

[[city]]
name = "Hong Kong"
airports = ["HKG"]
under_aud = 1000

# Lookouts: one specific one-way flight to watch until its date (owner's request, 24 Oct 2026).
# "depart_before" is local Sydney time; "airline" is the IATA code (VA = Virgin Australia).
[[lookout]]
name = "Sydney → Adelaide"
destination = "ADL"
date = "2026-11-24"
airline = "VA"
depart_before = "12:00"

# Loyalty programmes: a fare gets a small badge when the airline(s) selling it earn with the
# programme. Earning still depends on the fare class, which the data does not show, so the
# badge means "may earn" — check the fare rules before booking.
[loyalty.velocity]
name = "Velocity"
# Virgin Australia and the airline partners listed by Velocity (Oct 2026): Qatar Airways,
# Singapore Airlines, ANA, United, Air Canada, Hainan, Hong Kong Airlines, Tianjin, Beijing Capital.
airlines = ["VA", "QR", "SQ", "NH", "UA", "AC", "HU", "HX", "GS", "JD"]

[loyalty.skypearl]
name = "Sky Pearl"
# China Southern, its group airlines Xiamen and Chongqing, and partners named by Sky Pearl Club
# (Sichuan, American, Aerolíneas Argentinas, Air Europa, Air France, China Airlines, Delta, KLM,
# Korean Air, Vietnam Airlines). The partner list should be re-checked on skypearl.csair.com.
airlines = ["CZ", "MF", "OQ", "3U", "AA", "AR", "UX", "AF", "CI", "DL", "KL", "KE", "VN"]
